[project]
name = "showroom-scanner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Salem Alazzawi", email = "sloom99q@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.145.0",
    "docling[ocrmac]>=2.145.0; sys_platform == 'darwin'",
    "pymupdf>=2.0",
]

[project.scripts]
showroom-scanner = "showroom_scanner:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]
